<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#080a10;color:#f5f3ee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.page{max-width:1240px;padding:30px 42px 70px;margin:auto}.nav{display:flex;align-items:center;gap:38px;border-bottom:1px solid #242832;padding-bottom:25px}.brand{font-size:18px;font-weight:850;letter-spacing:.14em}.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ea6547;margin-right:9px}.tabs{display:flex;gap:8px}.tabs button{border:0;background:transparent;color:#9399a6;padding:9px 15px;border-radius:18px;font-size:14px;cursor:pointer}.tabs button.active{color:#0a0c11;background:#f4f1e9;font-weight:700}.search{margin-left:auto;width:270px;background:#151923;border:1px solid #2a2f3a;border-radius:9px;display:flex;align-items:center;padding:0 12px;color:#8f96a5}.search input{background:transparent;border:0;outline:0;color:#fff;width:100%;height:38px;padding-left:8px}.search input::placeholder{color:#767d8b}.scope{font-size:11px;color:#ea6547;white-space:nowrap}.intro{padding:50px 0 28px;display:flex;align-items:end;justify-content:space-between}.eyebrow{color:#ea6547;letter-spacing:.13em;font-size:11px;font-weight:800}.intro h1{font-size:34px;letter-spacing:-.045em;margin:9px 0 0}.count{color:#8f96a5;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.card{cursor:pointer}.poster{height:264px;border-radius:13px;background-size:cover;background-position:center;position:relative;box-shadow:0 15px 30px #0005;transition:.2s}.card:hover .poster{transform:translateY(-5px)}.poster:after{content:'▶';position:absolute;right:11px;bottom:11px;width:33px;height:33px;border-radius:50%;background:#f5f3ee;color:#151820;display:grid;place-items:center;font-size:11px}.series:after{content:'剧集';font-size:11px;font-weight:700;width:auto;padding:0 11px;border-radius:17px}.p1{background-image:url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=560&q=85')}.p2{background-image:url('https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&w=560&q=85')}.p3{background-image:url('https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=560&q=85')}.p4{background-image:url('https://images.unsplash.com/photo-1485095329183-d0797cdc5676?auto=format&fit=crop&w=560&q=85')}.p5{background-image:url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=560&q=85')}.title{font-size:14px;font-weight:700;margin:11px 0 4px}.meta{font-size:12px;color:#8e95a3}.detail{display:none;margin-top:38px;padding:28px;border:1px solid #292e39;border-radius:15px;background:#11151e}.detail.show{display:flex;gap:26px}.mini{width:105px;height:145px;border-radius:9px;background:url('https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=300&q=80') center/cover;flex:none}.detail h2{margin:2px 0 9px;font-size:21px}.detail p{color:#a5aab5;font-size:13px;margin:0 0 18px}.episodes{display:flex;gap:9px;flex-wrap:wrap}.ep{border:1px solid #343a47;border-radius:7px;background:#1b202b;color:#e9e7e0;padding:9px 13px;font-size:12px;cursor:pointer}.ep:first-child{border-color:#ea6547;color:#ff977e}@media(max-width:760px){.page{padding:22px}.nav{gap:13px;flex-wrap:wrap}.search{order:3;width:100%;margin:0}.scope{display:none}.grid{grid-template-columns:repeat(2,1fr)}.poster{height:240px}.intro h1{font-size:28px}}
</style></head><body><main class="page"><nav class="nav"><div class="brand"><i></i>FRAME</div><div class="tabs"><button class="active" onclick="setTab(this,'all')">全部</button><button onclick="setTab(this,'movie')">电影</button><button onclick="setTab(this,'show')">美剧</button></div><label class="search">⌕<input id="q" oninput="filter()" placeholder="搜索电影、剧名或集名"><b class="scope" id="scope">全部</b></label></nav><section class="intro"><div><div class="eyebrow" id="label">MY COLLECTION</div><h1 id="headline">留住每一段值得重看的故事。</h1></div><div class="count" id="count">5 个收藏</div></section><section class="grid"><article class="card movie" data-name="星际穿越" onclick="openMovie('星际穿越')"><div class="poster p1"></div><p class="title">星际穿越</p><p class="meta">电影 · 2014</p></article><article class="card movie" data-name="花样年华" onclick="openMovie('花样年华')"><div class="poster p2"></div><p class="title">花样年华</p><p class="meta">电影 · 2000</p></article><article class="card show" data-name="绝命毒师 第一季 化学课" onclick="openShow()"><div class="poster p3 series"></div><p class="title">绝命毒师</p><p class="meta">美剧 · 5 季 · 62 集</p></article><article class="card movie" data-name="海上钢琴师" onclick="openMovie('海上钢琴师')"><div class="poster p4"></div><p class="title">海上钢琴师</p><p class="meta">电影 · 1998</p></article><article class="card show" data-name="怪奇物语 第一季 消失的威尔" onclick="openShow()"><div class="poster p5 series"></div><p class="title">怪奇物语</p><p class="meta">美剧 · 4 季 · 34 集</p></article></section><section class="detail" id="detail"><div class="mini"></div><div><div class="eyebrow">SERIES</div><h2>绝命毒师</h2><p>选择一集开始播放。本季 7 集。</p><div class="episodes"><button class="ep">S01E01 · 化学课</button><button class="ep">S01E02 · 猫之袋</button><button class="ep">S01E03 · 继续努力</button><button class="ep">S01E04 · 严重后果</button></div></div></section></main><script>let type='all';const labels={all:'全部',movie:'电影',show:'美剧'};function setTab(e,t){type=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));e.classList.add('active');document.getElementById('scope').textContent=labels[t];document.getElementById('label').textContent=t==='all'?'MY COLLECTION':labels[t].toUpperCase();document.getElementById('headline').textContent=t==='show'?'一张海报，打开一整段故事。':'留住每一段值得重看的故事。';document.getElementById('detail').classList.remove('show');filter()}function filter(){let q=document.getElementById('q').value.trim(),n=0;document.querySelectorAll('.card').forEach(c=>{let visible=(type==='all'||c.classList.contains(type))&&(!q||c.dataset.name.includes(q));c.style.display=visible?'block':'none';if(visible)n++});document.getElementById('count').textContent=q?'找到 '+n+' 个结果':n+' 个收藏'}function openShow(){document.getElementById('detail').classList.add('show');document.getElementById('detail').scrollIntoView({behavior:'smooth'})}function openMovie(n){alert('演示：打开“'+n+'”的本地播放器')}</script></body></html>
